<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E"/>
      <stop offset="100%" style="stop-color:#0F0F1A"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect x="50" y="80" width="300" height="240" rx="15" fill="none" stroke="#FF00FF" stroke-width="2" filter="url(#glow)" opacity="0.6"/>
  <text x="120" y="200" font-family="Georgia, serif" font-size="120" fill="#00FFFF" filter="url(#glow-strong)">"</text>
  <text x="280" y="280" font-family="Georgia, serif" font-size="120" fill="#FF00FF" filter="url(#glow-strong)">"</text>
  <line x1="100" y1="320" x2="300" y2="320" stroke="#00FF00" stroke-width="2" filter="url(#glow)" opacity="0.5"/>
  <line x1="150" y1="340" x2="250" y2="340" stroke="#FF6600" stroke-width="2" filter="url(#glow)" opacity="0.4"/>
  <circle cx="60" cy="50" r="2" fill="#FF00FF" filter="url(#glow)" opacity="0.7"/>
  <circle cx="340" cy="70" r="2" fill="#00FFFF" filter="url(#glow)" opacity="0.7"/>
  <circle cx="50" cy="350" r="1.5" fill="#00FF00" filter="url(#glow)" opacity="0.5"/>
  <circle cx="350" cy="360" r="1.5" fill="#FF6600" filter="url(#glow)" opacity="0.5"/>
  <text x="200" y="385" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#00FFFF" text-anchor="middle" letter-spacing="8" filter="url(#glow-strong)">QUOTE</text>
</svg>